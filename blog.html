<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブログ - 広野文治のホームページ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #c0c0c0;
      --surface: #d4d0c8;
      --border-light: #ffffff;
      --border-dark: #808080;
      --border-darker: #404040;
      --text: #000000;
      --link: #0000ee;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans JP', 'MS Gothic', monospace;
      font-size: 13px;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .raised {
      border: 2px solid;
      border-color: var(--border-light) var(--border-dark) var(--border-dark) var(--border-light);
    }
    .sunken {
      border: 2px solid;
      border-color: var(--border-darker) var(--border-light) var(--border-light) var(--border-darker);
    }

    .page {
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* SITE HEADER */
    .site-header {
      background: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .site-title {
      font-family: 'VT323', monospace;
      font-size: clamp(18px, 4vw, 28px);
      color: #000080;
      text-shadow: 1px 1px 0 #808080;
      letter-spacing: 2px;
      text-decoration: none;
    }
    .site-nav { display: flex; gap: 4px; flex-wrap: wrap; }
    .nav-link {
      padding: 3px 10px;
      background: var(--surface);
      border: 2px solid;
      border-color: var(--border-light) var(--border-dark) var(--border-dark) var(--border-light);
      text-decoration: none;
      color: var(--link);
      font-size: 12px;
    }
    .nav-link:hover { background: #000080; color: white; }
    .nav-link:active {
      border-color: var(--border-darker) var(--border-light) var(--border-light) var(--border-darker);
    }

    /* PAGE TITLE */
    .page-title {
      background: #000080;
      color: white;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: bold;
    }

    /* BLOG LIST */
    .blog-list {
      background: white;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
    }

    .blog-card {
      display: flex;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
      text-decoration: none;
      color: inherit;
    }
    .blog-card:last-child { border-bottom: none; }
    .blog-card:hover { background: #f0f0f8; }

    .blog-card-img {
      width: 100px;
      height: 75px;
      object-fit: cover;
      border: 1px solid #808080;
      flex-shrink: 0;
    }
    .blog-card-img-placeholder {
      width: 100px;
      height: 75px;
      background: #e8e8e8;
      border: 1px dashed #808080;
      flex-shrink: 0;
    }
    .blog-card-body {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .blog-card-title {
      font-size: 14px;
      color: #0000ee;
      font-weight: bold;
    }
    .blog-card-date { font-size: 11px; color: #808080; }
    .blog-card-summary { font-size: 12px; line-height: 1.7; color: #333; }

    .blog-empty { font-size: 13px; color: #808080; padding: 20px 0; text-align: center; }

    /* HR */
    hr.retro {
      border: none;
      border-top: 2px solid var(--border-darker);
      border-bottom: 1px solid var(--border-light);
      margin: 2px 0;
    }

    /* FOOTER */
    .footer {
      background: var(--surface);
      padding: 10px;
      text-align: center;
      font-size: 11px;
      color: #808080;
    }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 16px; }
    ::-webkit-scrollbar-track { background: var(--surface); }
    ::-webkit-scrollbar-thumb {
      background: var(--surface);
      border: 1px solid;
      border-color: var(--border-light) var(--border-darker) var(--border-darker) var(--border-light);
    }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      .page { padding: 8px; gap: 8px; }
      .blog-card-img, .blog-card-img-placeholder { width: 72px; height: 54px; }
    }
  </style>
</head>
<body>

<div class="page">

  <!-- サイトヘッダー -->
  <div class="site-header sunken">
    <a class="site-title" href="index.html">広野文治のホームページ</a>
    <nav class="site-nav">
      <a class="nav-link" href="index.html">トップ</a>
      <a class="nav-link" href="blog.html">ブログ</a>
    </nav>
  </div>

  <!-- ページタイトル -->
  <div class="page-title raised">ブログ</div>

  <!-- 記事一覧 -->
  <div class="blog-list sunken" id="blog-list">
    <p class="blog-empty">読み込み中...</p>
  </div>

  <hr class="retro">

  <!-- フッター -->
  <div class="footer raised">
    <div>© 2026 広野文治. All Rights Reserved.</div>
  </div>

</div>

<script>
  fetch('blog.json')
    .then(res => res.json())
    .then(posts => {
      const container = document.getElementById('blog-list');
      if (!posts || posts.length === 0) {
        container.innerHTML = '<p class="blog-empty">まだ記事がありません。</p>';
        return;
      }
      container.innerHTML = posts.map(post => `
        <a class="blog-card" href="${post.url}">
          ${post.image
            ? `<img class="blog-card-img" src="${post.image}" alt="${post.title}">`
            : `<div class="blog-card-img-placeholder"></div>`
          }
          <div class="blog-card-body">
            <div class="blog-card-title">${post.title}</div>
            <div class="blog-card-date">${post.date}</div>
            <div class="blog-card-summary">${post.summary}</div>
          </div>
        </a>
      `).join('');
    })
    .catch(() => {
      document.getElementById('blog-list').innerHTML =
        '<p class="blog-empty">記事を取得できませんでした。</p>';
    });
</script>

</body>
</html>
