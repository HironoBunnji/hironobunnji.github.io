<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サイト移転のお知らせ</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            background-color: #f9f9f9;
        }

        /* 点滅アニメーション */
        .blink {
            color: #ff0000;
            font-size: 2rem;
            font-weight: bold;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .new-link {
            margin: 20px 0;
            font-size: 1.2rem;
        }

        /* 移動ボタンのスタイル */
        .btn {
            display: inline-block;
            padding: 15px 30px;
            font-size: 1.2rem;
            color: #fff;
            background-color: #007bff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="blink">ドメイン移行のお知らせ！！</div>

    <div class="new-link">
        新しいURL：<a href="https://hironobunji.jp">https://hironobunji.jp</a>
    </div>

    <a href="https://hironobunji.jp" class="btn">新しいサイトへ移動する</a>

</body>
</html>
