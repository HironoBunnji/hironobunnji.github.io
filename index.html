<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>移転のお知らせ</title>
    <style>
        /* 点滅の動き */
        .blink {
            color: red;
            font-weight: bold;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
        
        body { text-align: center; padding-top: 50px; font-family: sans-serif; }
        .btn { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="blink">ドメイン移行のお知らせ！！</div>

    <p>新URL: <a href="https://hironobunji.jp">https://hironobunji.jp</a></p>

    <a href="https://hironobunji.jp" class="btn">新しいサイトへ移動</a>

</body>
</html>
