<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>移転のお知らせ</title>
    <style>
        body { text-align: center; padding-top: 100px; font-family: sans-serif; }
        .blink {
            color: red;
            font-size: 24px;
            font-weight: bold;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
        .link { margin-top: 20px; display: block; font-size: 18px; }
    </style>
</head>
<body>

    <div class="blink">ドメイン移行のお知らせ！！</div>

    <a href="http://hironobunji.jp" class="link">新サイト：http://hironobunji.jp</a>

</body>
</html>
